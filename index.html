<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eco Loop - สมัครสมาชิก</title>
    <!-- โหลดไลบรารี Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: sans-serif; padding: 20px; background-color: #f9f9f9; }
        .container { background: white; padding: 30px; border-radius: 8px; max-width: 400px; margin: 0 auto; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        input { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { width: 100%; padding: 10px; background-color: #4CAF50; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; }
        button:hover { background-color: #45a049; }
    </style>
</head>
<body>

<div class="container">
    <h2>สมัครสมาชิก EcoLoop</h2>
    <form id="register-form">
        <label>ชื่อ-นามสกุล</label>
        <input type="text" id="name" required placeholder="เช่น baiyok">

        <label>รหัสนักศึกษา</label>
        <input type="text" id="student_id" required placeholder="เช่น 67407538">

        <label>รหัสผ่าน</label>
        <input type="password" id="password" required>

        <button type="submit">สร้างบัญชีสมาชิก</button>
    </form>
</div>

<script>
    // ตั้งค่าการเชื่อมต่อ Supabase
    const SUPABASE_URL = 'https://dmwgphdcrwexzzckurgc.supabase.co';
    // *** ต้องเปลี่ยนค่าด้านล่างนี้เป็น Anon Key ของคุณจากหน้า Supabase Dashboard ***
    const SUPABASE_ANON_KEY = 'YOUR_SUPABASE_ANON_KEY';
    
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // จัดการการส่งฟอร์ม
    document.getElementById('register-form').addEventListener('submit', async function(event) {
        event.preventDefault(); // ป้องกันหน้าเว็บรีเฟรช

        const name = document.getElementById('name').value;
        const studentId = document.getElementById('student_id').value;
        const password = document.getElementById('password').value;

        try {
            // บันทึกข้อมูลลงตาราง users ใน Supabase
            const { data, error } = await supabaseClient
                .from('users')
                .insert([
                    { 
                        name: name, 
                        student_id: studentId, 
                        password: password, // แนะนำให้เข้ารหัสในระบบจริง
                        points: 0 
                    }
                ]);

            if (error) throw error;

            alert('สร้างบัญชีสำเร็จ!');
            // ล้างฟอร์ม
            document.getElementById('register-form').reset();
            // window.location.href = 'login.html'; // หากมีหน้าล็อกอินให้เปิดคอมเมนต์นี้

        } catch (err) {
            console.error('Error:', err);
            alert('เกิดข้อผิดพลาด: ' + err.message);
        }
    });
</script>

</body>
</html>
